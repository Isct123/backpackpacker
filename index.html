<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pack your bags</title>
</head>
<body>
    <div class="e">
    <h1 id="day_today">THE BACKPACKER </h1>
      
    </div>
    
    <button id="tue">Tuesday</button>
    <button id="thur">Thursday</button>
    <div id="classes_today_div">
        <h3 id = "classes_today"></h3>
    </div>
    
    <script src="cookies.js"></script>
    <script>
        document.getElementById("tue").addEventListener("click", function(){
            document.getElementById("classes_today").innerText = getCookie("tuesday-books")
        })
        document.getElementById("thur").addEventListener("click", function(){
            document.getElementById("classes_today").innerText = getCookie("thursday-books")
        })
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&display=swap');
        </style>
    <style>
        *{
            font-family: 'Open Sans', sans-serif;
        }
        button{
            height: 50px;
            width: 150px;
            font-size: 15px;
            background-color: orange;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 10px;
        }
        button:hover{
            cursor: pointer;
            background-color: white;
            color: black;
            transition: 1s;
        }
        html{
            background-image: url("https://coolbackgrounds.io/images/backgrounds/index/compute-ea4c57a4.png");
        }
        div{
            border-style: solid;
            border-width: 5px;
            color: white;
            margin: 5px;
            padding: 5px;
            border-radius: 5px;
            width: fit-content;
        }
        #classes_today_div{
            background-color: white;
        }
        #classes_today{
            color: black !important;
        }
        iframe{
            border-style: dashed;
            border-width: 10px;
            border-color: white;
        }
        html {
  scroll-behavior: smooth;
}
        .e{
            margin: 0px auto;
            background-color: orangered;
            border-color: black;
            border-radius: 10px;
        }
    </style>
    <iframe src="books_tbp.html" frameborder="1" width = 1080px height = 600px></iframe>
</body>
</html>
